<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五代独立互动浏览器验收</title><style>body{font:16px system-ui;margin:16px}button{padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}iframe{display:block;border:1px solid #789;max-width:none;height:844px;margin:20px 0}</style></head><body>
<h1>五代独立互动浏览器验收</h1><p>使用真实首页、脚本、控件与演示入口。每个视口使用独立内存存储，不访问你的正式存档。全屏和真实手机触摸需额外人工检查。</p><button id="run">运行五种视口验收</button><pre id="results">未运行</pre><div id="frames"></div>
<script>
const report={status:'NOT_RUN',checks:[],errors:[]};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(fn,label){for(let i=0;i<160;i++){if(fn())return;await wait(50);}throw Error('等待失败：'+label);}
function check(ok,label,detail){report.checks.push({ok:!!ok,label,detail});if(!ok)throw Error(label+': '+JSON.stringify(detail));}
document.getElementById('run').onclick=async function(){
 this.disabled=true;report.status='RUNNING';report.checks=[];report.errors=[];
 try{
  const response=await fetch('../../index.html',{cache:'no-store'});if(!response.ok)throw Error('首页读取失败');const original=await response.text(),base=new URL('../../',location.href).href;
  const storageBootstrap='<script>function memoryStore(){const data=new Map();return {getItem:k=>data.has(k)?data.get(k):null,setItem:(k,v)=>data.set(String(k),String(v)),removeItem:k=>data.delete(k),key:i=>[...data.keys()][i]||null,get length(){return data.size}}}Object.defineProperty(window,"localStorage",{value:memoryStore()});Object.defineProperty(window,"sessionStorage",{value:memoryStore()});<\/script>';
  for(const width of [320,360,390,430,1366]){
   const frame=document.createElement('iframe');frame.style.width=width+'px';frame.title=width+'px真实应用';document.querySelector('#frames').append(frame);
   frame.srcdoc=original.replace('<head>','<head><base href="'+base+'">'+storageBootstrap);
   const w=frame.contentWindow;await until(()=>w.CommsArchiveApp?.status==='ready'&&typeof w.startFreeDemo==='function'&&w.LanVoice,'应用与演示脚本初始化');
   const drain=()=>{for(let i=0;i<80&&w.CommsArchiveLan.debugSnapshot().isPlaying;i++)w.CommsArchiveLan.skip();check(!w.CommsArchiveLan.debugSnapshot().isPlaying,width+'对白可结束');};
   const click=(action,value)=>{const controls=[...w.document.querySelectorAll('[data-ix-action]')].filter(b=>b.dataset.ixAction===action&&(value===undefined||b.dataset.ixValue===String(value)));check(controls.length>0,'实际控件 '+action);controls[0].click();};
   const input=(field,value)=>{const node=w.document.querySelector('[data-ix-input="'+field+'"]');check(!!node,'输入控件 '+field);node.value=String(value);node.dispatchEvent(new w.Event(node.tagName==='SELECT'?'change':'input',{bubbles:true}));};
   drain();w.startFreeDemo();drain();const formal=w.localStorage.getItem('commsArchive');
   for(const era of ['2G','3G','4G','5G','6G']){
    check(w.enterEra(['1G','2G','3G','4G','5G','6G'].indexOf(era))!==false,width+'进入'+era);drain();
    const before=w.eval('JSON.stringify(state)'),progress=w.eval('JSON.stringify(progression.state)');
    const entry=[...w.document.querySelectorAll('button')].find(b=>b.getAttribute('onclick')===`openEraExperience('${era}')`);check(!!entry,'主线真实互动入口 '+era);entry.click();
    check(w.CommsArchiveApp.getRoute()==='experience','进入互动路由');
    const opening=w.CommsArchiveLan.debugSnapshot();check(opening.displayMode==='dialogue'&&opening.domParent==='body',era+'真实中央开场',opening);
    const box=w.document.querySelector('#lanCompanion'),r=box.getBoundingClientRect();check(r.left>=-1&&r.right<=w.innerWidth+1,era+'对白不横向越界',{left:r.left,right:r.right,width:w.innerWidth});drain();
    const api=w.CommsIndependentExperiences;
    if(era==='2G'){const draft='中'.repeat(69)+'👨‍👩‍👧‍👦';input('draft',draft+'余');check(api.getState(era).draft===draft&&w.document.querySelector('[data-ix-input="draft"]').value===draft,'2G超长emoji按可见字符截断且界面一致');input('draft','我平安到达了😀');click('send');click('console');input('config','enabled');click('test');click('phone');check(w.document.querySelector('[data-ix-input="draft"]').value==='我平安到达了😀','2G切换控制台后中文和emoji保持完整');click('send');click('inbox');check(api.getState(era).replyRead,'2G读取真实回复');}
    if(era==='3G'){click('cities');click('city','shanghai');click('weather');check(api.getState(era).page==='weather','3G天气显示');click('back');const portal=w.document.querySelector('.ix-portal');portal.focus();portal.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));check(api.getState(era).focus===1,'3G键盘方向键');click('ok');check(api.getState(era).page==='weather','3G确认键与点击一致');}
    if(era==='4G'){const video=w.document.querySelector('#ixVideo');await until(()=>video.readyState>=1||video.error,'本地视频元数据');check(!video.error,'4G视频可解码');click('play');await until(()=>!video.paused||api.getState(era).error,'视频开始播放');check(!video.paused,'4G实际播放');input('seek',50);input('volume',25);check(Math.abs(video.currentTime/video.duration-.5)<.15,'4G进度拖动');check(video.volume===.25&&!video.muted,'4G音量');click('pause');check(video.paused,'4G暂停');}
    if(era==='5G'){click('forward');await wait(200);check(api.getState(era).y===3,'5G移动');click('right');await wait(200);check(api.getState(era).direction===1,'5G转向');click('stop');check(api.getState(era).logs.length>=3,'5G实际日志');}
    if(era==='6G'){input('green',60);click('apply');check(api.getState(era).after[0].queue<api.getState(era).before[0].queue,'6G模型改善');input('junction',1);input('green',10);click('apply');check(api.getState(era).after[1].queue>api.getState(era).before[1].queue,'6G另一方案无需改善');}
    const panel=w.document.querySelector('[data-independent-era]');check(w.document.documentElement.scrollWidth<=w.innerWidth+1,width+'px无横向溢出 '+era,{scrollWidth:w.document.documentElement.scrollWidth,innerWidth:w.innerWidth});
    check(!/[\uFFFD]|[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/u.test(panel.innerText),width+'px操作反馈没有替代字符或孤立代理项 '+era);
    check([...panel.querySelectorAll('button')].every(b=>b.getBoundingClientRect().height>=43),width+'px触控高度 '+era);
    drain();click('end');drain();check(api.getState(era).ended,era+'结束总结');click('exit');check(w.CommsArchiveApp.getRoute()==='chapter',era+'返回主线');
    check(w.eval('JSON.stringify(state)')===before,era+'不修改主线存档');check(w.eval('JSON.stringify(progression.state)')===progress,era+'不修改节点证据');check(w.localStorage.getItem('commsArchive')===formal,era+'演示未污染正式存档');
    check(w.document.querySelectorAll('#lanCompanion').length===1,era+'没有重复澜面板');check(!w.CommsArchiveLan.debugSnapshot().inputLock,era+'退出无残留输入锁');
   }
  }
  report.status='PASS';
 }catch(error){report.status='FAIL';report.errors.push(String(error.stack||error));}
 document.body.dataset.result=report.status;document.querySelector('#results').textContent=JSON.stringify(report,null,2);this.disabled=false;
};
</script></body></html>
